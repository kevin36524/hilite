[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hilite"
version = "0.1.0"
description = "Bare-bones agent for Claude Code CLI users"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
hilite = "hilite:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hilite*"]
